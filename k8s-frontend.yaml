apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: uav-store
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hmquannnnn/uav-store-fe:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: NEXT_PUBLIC_API_ENDPOINT
              value: "http://api.uav-store.io.vn/api"
            - name: NEXT_PUBLIC_MINIO_PUBLIC_URL
              value: "http://storage.uav-store.io.vn"
            - name: NEXT_PUBLIC_STORAGE_BASE_URL
              value: "http://storage.uav-store.io.vn"
          livenessProbe:
            httpGet:
              path: /en
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /en
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '768Mi'
              cpu: '750m'

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: uav-store
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
